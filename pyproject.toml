[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "team15-snake-game"
version = "1.0.0"
description = "Team 15's desktop Snake game built with Python and Pygame"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pygame>=2.5,<3"]

[project.scripts]
team15-snake = "snake_game.__main__:main"

[tool.setuptools.packages.find]
include = ["snake_game*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
