name: Snake Game CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: 1. Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile source, tests and CI scripts
        run: python -m compileall -q snake_game tests .github/scripts main.py
      - name: Check package metadata and release tag
        shell: python
        run: |
          import os
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"Release tag must be v{version}, got {ref}")
          print(f"Validated {project['name']} {version}")
      - name: Source validation summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py
          --title "Source validation"
          --description "Compile application, tests and automation; check package metadata and version tags."

  quality:
    name: 2a. Code and workflow quality
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Ruff
        run: python -m pip install "ruff>=0.11,<1"
      - name: Check Python correctness
        run: python -m ruff check snake_game tests .github/scripts main.py
      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml
      - name: Code quality summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py
          --title "Code and workflow quality"
          --description "Ruff checks Python correctness; actionlint checks job dependencies, expressions and workflow syntax."

  security:
    name: 2b. Dependency security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install audit tools
        run: python -m pip install -r requirements-ci.txt
      - name: Audit application and test dependencies
        run: |
          mkdir -p reports
          python -m pip_audit -r requirements.txt --strict --format json --output reports/dependency-audit.json
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: reports/dependency-audit.json
          retention-days: 14
      - name: Security summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py
          --title "Dependency security"
          --description "Audit the resolved runtime and test dependencies; known vulnerabilities fail this job."
          --audit reports/dependency-audit.json

  unit-tests:
    name: 2c. Tests and branch coverage
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install test and coverage tools
        run: python -m pip install -r requirements-ci.txt
      - name: Run full suite and enforce 85 percent coverage
        run: >-
          python -m pytest -v --junitxml=reports/tests.xml
          --cov=snake_game --cov-branch --cov-fail-under=85
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/coverage-html
      - name: Upload tests and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-and-coverage
          path: reports/
          retention-days: 14
      - name: Tests and coverage summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py
          --title "Tests and branch coverage"
          --description "Run all gameplay, storage, UI and launcher tests with an 85% combined coverage gate."
          --junit reports/tests.xml --coverage reports/coverage.xml

  platform-tests:
    name: 2d. Platform tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Pygame and compile source
        run: |
          python -c "import pygame; print(pygame.version.ver)"
          python -m compileall -q snake_game main.py
      - name: Run full platform suite
        run: python -m pytest -v --junitxml=reports/platform-tests.xml
      - name: Upload platform results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: reports/platform-tests.xml
          retention-days: 14
      - name: Platform summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py
          --title "Platform tests (${{ matrix.os }}, Python ${{ matrix.python-version }})"
          --description "Run the complete suite, including fresh-process desktop launchers, with SDL dummy drivers."
          --junit reports/platform-tests.xml
          --note "Native window/input behavior and interactive performance still require manual desktop acceptance."

  gate:
    name: 3. Quality gate
    if: always()
    needs: [validate, quality, security, unit-tests, platform-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require all validation branches and write summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python .github/scripts/ci_summary.py --title "Quality gate"
          --required validate,quality,security,unit-tests,platform-tests

  package:
    name: 4. Build game distributions
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install build tools
        run: python -m pip install -r requirements-ci.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Record package checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Upload distributable game packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake-game-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Package summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py --title "Game distributions"
          --description "Build a Python wheel and source archive, validate metadata and upload SHA-256 checksums."
          --artifacts dist

  install-smoke:
    name: 5. Installed game (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake-game-distributions
          path: dist
      - name: Verify checksums, install wheel and exercise installed launchers
        run: python .github/scripts/package_smoke.py dist
      - name: Installed game summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py --title "Installed game (${{ matrix.os }})"
          --description "Verify package checksums, install the built wheel, then exercise the module and console entry point outside the source tree."
          --note "The installed game renders frames, changes direction, pauses, resumes and quits using headless SDL."

  release:
    name: 6. Publish GitHub Release (version tags)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require the release commit to belong to main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake-game-distributions
          path: dist
      - name: Publish tested distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Snake Game $GITHUB_REF_NAME"
          fi
      - name: Release summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: >-
          python .github/scripts/ci_summary.py --title "GitHub Release"
          --description "Publish the tested wheel, source archive and checksums for a matching version tag on main."
          --artifacts dist

  summary:
    name: 7. Pipeline overview
    if: always()
    needs: [validate, quality, security, unit-tests, platform-tests, gate, package, install-smoke, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Summarize every stage and fail if a required job did not pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python .github/scripts/ci_summary.py --title "CI/CD pipeline overview"
          --required validate,quality,security,unit-tests,platform-tests,gate,package,install-smoke
